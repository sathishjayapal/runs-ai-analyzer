# Standalone compose for runs-ai-analyzer — DB values match the shared
# consolidated-postgres/compose/docker-compose-local.yml `runs-ai-analyzer-db`
# service (canonical; that's what dev-up.sh starts). Use this when you only need
# this project's DB + Ollama by itself:
#   docker compose up -d
# Reads RUNS_AI_ANALYZER_DB_* from ./.env (created by dev-up.sh).
services:
  postgres:
    container_name: runs-ai-analyzer-db
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}
      - POSTGRES_USER=${RUNS_AI_ANALYZER_DB_USER:?set in .env}
      - POSTGRES_PASSWORD=${RUNS_AI_ANALYZER_DB_PASSWORD:?set in .env}
    ports:
      - 5444:5432
    volumes:
      - runs_ai_shared_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RUNS_AI_ANALYZER_DB_USER} -d ${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Run this after ollama starts to pull the embedding model
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: "no"

